  <path d="M24 13C24 13 22.5 15.2 22.5 16.5C22.5 17.3 23.2 18 24 18C24.8 18 25.5 17.3 25.5 16.5C25.5 15.2 24 13 24 13Z" fill="#fef3c7"/>

  <!-- Open Book of Knowledge -->
  <path d="M16 26.5C18.5 25.5 21.5 25.5 24 27C26.5 25.5 29.5 25.5 32 26.5V34C29.5 33 26.5 33 24 34.5C21.5 33 18.5 33 16 34V26.5Z" fill="#ffffff" fill-opacity="0.95" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M24 27V34.5" stroke="#94a3b8" stroke-width="1.2"/>
  
  <!-- Subtle Laurel Wings -->
  <path d="M14 20C13 22.5 13 26 14.5 28.5" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34 20C35 22.5 35 26 33.5 28.5" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

